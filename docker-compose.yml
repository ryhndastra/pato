version: '3.8'

services:

  # ──────────────────────────────────────────────
  # 1. BACKEND API (Express + TypeScript + Node 22)
  # ──────────────────────────────────────────────
  backend_pato:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pato_backend
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      - PORT=4000
      - NODE_ENV=production
    ports:
      # Bind ke localhost agar tidak terbuka langsung ke internet publik
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ──────────────────────────────────────────────
  # 2. WEB SERVER - Frontend React & Nginx Proxy
  # ──────────────────────────────────────────────
  web_pato:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-719565988722-k5ggk4uck65skvn506bhilpi4gv90uc2.apps.googleusercontent.com}
    container_name: pato_web
    restart: unless-stopped
    ports:
      # Port HTTP lokal yang di-expose ke host (default: 80).
      # Sambungkan Cloudflare Tunnel (cloudflared) ke port ini!
      - "127.0.0.1:${APP_PORT:-80}:80"
    depends_on:
      backend_pato:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # 3. DATABASE POSTGRESQL (Opsional jika tidak memakai Supabase)
  # ──────────────────────────────────────────────
  postgres_pato:
    image: postgres:16-alpine
    container_name: pato_postgres
    restart: unless-stopped
    profiles:
      - local-db # Hanya dijalankan jika menambahkan flag: --profile local-db
    environment:
      POSTGRES_USER: ${LOCAL_DB_USER:-pato_user}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-pato_password}
      POSTGRES_DB: ${LOCAL_DB_NAME:-pato_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER:-pato_user} -d ${LOCAL_DB_NAME:-pato_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
