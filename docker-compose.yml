services:
  postgres:
    image: postgres:16-alpine
    container_name: pato-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pato_user
      POSTGRES_PASSWORD: pato_password
      POSTGRES_DB: pato_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
