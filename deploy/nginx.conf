server {
    listen 80;
    listen [::]:80;
    server_name _; # Menerima semua host dari Cloudflare Tunnel atau domain Anda

    # Lokasi hasil build frontend (sesuaikan path folder clone Anda)
    root /var/www/pato/frontend/dist;
    index index.html;

    # Limit upload foto struk belanja / receipt OCR
    client_max_body_size 25M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Frontend SPA routing: semua route diarahkan ke index.html (mencegah 404 saat refresh)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy untuk Backend API Express
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Meneruskan header HTTPS dari Cloudflare
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # Cache file statis aset frontend (Vite menggunakan hashing otomatis)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
