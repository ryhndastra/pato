<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pato-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="description" content="PaTo (Pay Together) - Platform Split Bill Akurat dan Proporsional" />
    
    <!-- iOS / PWA Meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PaTo" />
    <meta name="application-name" content="PaTo" />

    <title>PaTo - Pay Together</title>
    <link rel="preload" as="image" href="/pato-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant First-Paint Splash Screen (Zero white screen while JS bundles download) -->
      <div
        id="initial-splash"
        style="
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #1d4ed8 linear-gradient(135deg, #1d4ed8 0%, #2563eb 50%, #1e40af 100%);
          color: #ffffff;
          user-select: none;
          font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
          overflow: hidden;
        "
      >
        <div style="position: relative; display: flex; align-items: center; justify-content: center;">
          <div
            style="
              width: 112px;
              height: 112px;
              border-radius: 36px;
              border: 4px solid rgba(255, 255, 255, 0.95);
              background: #ffffff;
              box-shadow: 0 24px 50px rgba(26, 54, 138, 0.45);
              display: flex;
              align-items: center;
              justify-content: center;
            "
          >
            <img src="/pato-192.png" alt="PaTo" width="80" height="80" style="object-fit: contain;" />
          </div>
        </div>

        <div style="margin-top: 24px; display: flex; flex-direction: column; align-items: center; text-align: center;">
          <div style="display: flex; align-items: center; font-size: 36px; font-weight: 900; letter-spacing: -0.02em; color: #ffffff;">
            PaTo
            <span style="margin-left: 4px; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #fbbf24; box-shadow: 0 0 12px rgba(251, 191, 36, 0.9);"></span>
          </div>

          <div style="margin-top: 8px; border-radius: 9999px; background: rgba(255, 255, 255, 0.15); padding: 2px 14px; font-size: 12px; font-weight: 700; color: #eff6ff; border: 1px solid rgba(255, 255, 255, 0.2);">
            Pay Together • Split Bill Pintar
          </div>

          <p style="margin-top: 8px; font-size: 12px; font-weight: 500; color: rgba(255, 255, 255, 0.8); letter-spacing: 0.02em; max-width: 250px;">
            Bagi tagihan makan bareng tanpa drama & hitungan ribet
          </p>

          <div style="margin-top: 24px; width: 160px; height: 6px; border-radius: 9999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; padding: 1px;">
            <div style="height: 100%; width: 25%; border-radius: 9999px; background: linear-gradient(to right, #bfdbfe, #ffffff, #fef3c7); box-shadow: 0 0 10px rgba(255, 255, 255, 0.85);"></div>
          </div>
        </div>

        <div style="position: absolute; bottom: 24px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; pointer-events: none;">
          <span style="font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em; color: rgba(255, 255, 255, 0.4); font-family: monospace;">
            PaTo App
          </span>
          <span style="font-size: 9px; color: rgba(255, 255, 255, 0.3);">Memuat aplikasi...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
